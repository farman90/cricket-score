<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WS Arena - Cricket Scoreboard</title>
<style>
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
       gap:22px;background:#0b1220;color:#93a3c0;font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,Arial,sans-serif;
       padding:24px;text-align:center}
  .arena{font-weight:900;letter-spacing:4px;text-transform:uppercase;font-size:clamp(22px,5vw,36px);
         color:#39ff14;text-shadow:0 0 18px rgba(57,255,20,.55)}
  .links{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
  a.btn{display:inline-block;padding:14px 22px;border-radius:12px;text-decoration:none;
        font-weight:700;font-size:16px;border:1px solid #243350}
  a.display{background:#39ff14;color:#06240f;border-color:#39ff14}
  a.control{background:#1b2740;color:#eaf0fb}
  .hint{font-size:13px;max-width:420px}
</style>
</head>
<body>
  <div class="arena">WS Arena</div>
  <div class="links">
    <a class="btn display" href="display.html">Open Display</a>
    <a class="btn control" href="control.html">Open Scorer Control</a>
  </div>
  <div class="hint">Projector/TV should open <b>Display</b>. The scorer's phone should open <b>Scorer Control</b> and log in there.</div>
</body>
</html>
